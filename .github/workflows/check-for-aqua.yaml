name: 'Check as aqua custom registry'

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'registry.yaml'
      - 'aqua/**.yaml'
  workflow_dispatch:

jobs:
  validate-registry:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.43.1
